# MediaMTX config for MK VISION pre-listen.
# OBS pushes the pre-listen track (Track 2) as Opus to path "mk" over RTSP; phones and laptops play it over WebRTC.
# Ports: RTSP 8554 (OBS -> server), WebRTC 8889 TCP + 8189 UDP (server -> devices).
# If a phone connects but stays silent, set your OBS PC LAN IP here:
# webrtcAdditionalHosts: [192.168.0.100]
paths:
  mk:
